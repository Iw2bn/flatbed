server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Cloudflare terminates HTTPS (the camera needs a secure origin); this is plain HTTP inside the tunnel.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(self)" always;

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # App shell: always revalidate, so a new deploy reaches phones on the next online visit.
    location ~ ^/(index\.html|sw\.js)?$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self)" always;
        try_files $uri /index.html;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    location /icons/ { add_header Cache-Control "public, max-age=86400" always; }

    location / { try_files $uri =404; }
}
