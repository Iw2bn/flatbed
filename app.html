<meta charset="utf-8">
<title>Flatbed</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a one-screen phone app. Stacked full-height views, each = header / scrolling body / thumb-reach action bar.
   Editing screens ("studio") are always dark so photos read true; the library and document follow the theme. */
:root{
  --bg:#F1F2F6; --surface:#FFFFFF; --ink:#151721; --muted:#5D6173; --line:#DCDEE7;
  --accent:#3B47D6; --accent-ink:#FFFFFF; --accent-soft:#E3E5FB;
  --handle:#FFB21E; --danger:#C93636;
  --studio:#0C0D11; --studio-2:#181A21; --studio-3:#262933; --studio-ink:#F2F3F7; --studio-muted:#9CA0AE;
  --font-ui:"Instrument Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1015; --surface:#1A1C24; --ink:#ECEDF3; --muted:#9A9EAE; --line:#2B2E39;
  --accent:#8189FF; --accent-ink:#0F1015; --accent-soft:#252A55; --danger:#FF6B6B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1015; --surface:#1A1C24; --ink:#ECEDF3; --muted:#9A9EAE; --line:#2B2E39;
  --accent:#8189FF; --accent-ink:#0F1015; --accent-soft:#252A55; --danger:#FF6B6B; color-scheme:dark}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body.in-studio{background:var(--studio)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

#app{position:relative;height:100%;overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);animation:viewIn .22s ease-out}
.view.studio{background:var(--studio);color:var(--studio-ink)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* headers */
.bar{display:flex;align-items:center;gap:8px;min-height:56px;padding-block:8px}
.bar .title{flex:1;min-width:0;text-align:center;font-weight:600;font-size:16px}
.bar .title small{display:block;font-weight:500;font-size:12px;color:var(--studio-muted)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none}
.icon-btn:active{background:color-mix(in srgb,currentColor 12%,transparent)}
.text-btn{min-height:44px;padding-inline:10px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.text-btn:active{background:color-mix(in srgb,currentColor 12%,transparent)}

/* buttons */
.btn{min-height:52px;padding:0 20px;border-radius:var(--r);font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--surface);color:var(--ink);border:1px solid var(--line);transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;pointer-events:none}
.studio .btn{background:var(--studio-3);color:var(--studio-ink);border-color:transparent}
.studio .btn.primary{background:var(--handle);color:#17120A}
.actions{display:flex;gap:10px;padding-block:12px 14px}
.actions>.btn{flex:1;min-width:0;padding:0 12px;white-space:nowrap}
.actions>.btn.sq{flex:none;width:52px;padding:0}

/* ---------- library ---------- */
.lib-head{padding-block:22px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.wordmark{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1;display:flex;align-items:center;gap:10px}
.wordmark .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);position:relative;flex:none}
.wordmark .mark::before{content:"";position:absolute;left:7px;right:7px;top:6px;bottom:6px;background:var(--surface);border-radius:2px}
.wordmark .mark::after{content:"";position:absolute;left:4px;right:4px;top:14px;height:2px;background:var(--handle);box-shadow:0 0 6px var(--handle)}
.lib-sub{color:var(--muted);font-size:13px;margin-top:6px}
.lib-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:12px}
.doc-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.doc-row{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 4px 8px 8px}
.doc-open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.doc-thumb{width:48px;height:62px;object-fit:cover;border-radius:6px;background:var(--bg);border:1px solid var(--line);flex:none}
.doc-text{min-width:0;display:flex;flex-direction:column;gap:3px}
.doc-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-meta{font-size:12px;color:var(--muted)}
.doc-row .icon-btn{color:var(--muted)}
.section-label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 2px 10px}
.local-note{font-size:12.5px;color:var(--muted);margin:16px 2px 4px;line-height:1.45}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 8px 8px;gap:14px}
.sheets{position:relative;width:170px;height:190px;margin-bottom:6px}
.sheets .s{position:absolute;inset:18px 30px;background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:0 10px 30px rgba(20,22,40,.10)}
.sheets .s1{transform:rotate(-8deg) translate(-10px,6px)}
.sheets .s2{transform:rotate(5deg) translate(8px,0)}
.sheets .s2::before{content:"";position:absolute;left:14px;right:22px;top:18px;height:5px;border-radius:3px;background:var(--line);box-shadow:0 14px 0 var(--line),0 28px 0 var(--line),-0px 42px 0 var(--line),0 70px 0 var(--accent-soft)}
.sheets .c{position:absolute;width:22px;height:22px;border:3px solid var(--handle)}
.sheets .c1{left:12px;top:6px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.sheets .c2{right:12px;top:6px;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
.sheets .c3{right:12px;bottom:6px;border-left:0;border-top:0;border-radius:0 0 6px 0}
.sheets .c4{left:12px;bottom:6px;border-right:0;border-top:0;border-radius:0 0 0 6px}
.empty h2{margin:0;font-size:21px;letter-spacing:-.01em;text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:30ch}
.link-btn{color:var(--accent);font-weight:600;min-height:44px;padding:0 8px}
.tips{display:grid;gap:8px;margin-top:10px;width:100%;max-width:420px;text-align:left}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tip b{color:var(--ink);font-weight:600}
.tip .mono{color:var(--accent);font-size:12px;padding-top:1px}

/* ---------- document ---------- */
.doc-name-input{flex:1;min-width:0;font:inherit;font-weight:600;font-size:17px;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:10px;padding:8px 10px;text-align:center;text-overflow:ellipsis}
.doc-name-input:focus{border-color:var(--line);background:var(--surface);outline:none;text-align:left}
.doc-sub{text-align:center;font-size:12px;color:var(--muted);margin-top:-6px}
.doc-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:14px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.tile{position:relative;display:block;width:100%;aspect-ratio:1/1.3;max-width:100%;border-radius:10px;background:var(--surface);border:1px solid var(--line);overflow:hidden;box-shadow:0 2px 10px rgba(20,22,40,.06)}
.tile img{width:100%;height:100%;object-fit:contain;display:block;background:var(--surface);pointer-events:none}
.tile .num{position:absolute;left:8px;bottom:8px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:rgba(15,16,21,.78);color:#fff;font-size:12px;display:grid;place-items:center}
.tile .lost-note{display:none}
.tile.lost img{display:none}
.tile.lost .lost-note{display:grid;place-items:center;position:absolute;inset:0;padding:14px;text-align:center;font-size:13px;color:var(--danger);font-weight:600}
.tile.fresh{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.03)}}
.tile.sortable-ghost{opacity:.35}
.tile.sortable-chosen{box-shadow:0 12px 30px rgba(20,22,40,.25);transform:scale(1.03)}
.add-tile{aspect-ratio:1/1.3;border-radius:10px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--accent);font-weight:600}
.add-tile:active{background:var(--accent-soft)}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:14px}

/* ---------- adjust (corners) ---------- */
.stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#adj-frame{position:absolute}
#adj-canvas{display:block;width:100%;height:100%}
#adj-svg{position:absolute;inset:0;overflow:visible}
#adj-svg .shade{fill:rgba(0,0,0,.5);fill-rule:evenodd}
#adj-svg .edge{fill:rgba(255,178,30,.08);stroke:var(--handle);stroke-width:2.5;stroke-linejoin:round}
#adj-svg.bad .edge{stroke:#FF5A5A;fill:rgba(255,90,90,.1)}
#adj-svg .h-ring{fill:rgba(255,178,30,.22);stroke:var(--handle);stroke-width:3}
#adj-svg .h-dot{fill:var(--handle)}
#adj-svg .h.active .h-ring{fill:rgba(255,178,30,.4)}
#adj-svg.bad .h-ring{stroke:#FF5A5A}
#loupe{position:absolute;width:128px;height:128px;border-radius:50%;border:3px solid var(--handle);box-shadow:0 8px 30px rgba(0,0,0,.55);pointer-events:none;background:#000}
.status{display:flex;justify-content:center;padding-block:8px 0}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;background:var(--studio-2);color:var(--studio-ink)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--studio-muted)}
.chip.ok .dot{background:#3FD68A}
.chip.warn .dot{background:var(--handle)}
.chip.bad .dot{background:#FF5A5A}
.chip.busy .dot{background:var(--handle);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- page view ---------- */
.pv-stage{display:grid;place-items:center;padding:12px}
.pv-stage img{max-width:100%;max-height:100%;object-fit:contain;display:block;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#fff;transition:opacity .15s}
.pv-stage img.dim{opacity:.55}
.pv-spin{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.filters{display:flex;gap:10px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none;justify-content:center}
.filters::-webkit-scrollbar{display:none}
.fchip{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--studio-muted);flex:none}
.fchip .fthumb{width:62px;height:62px;border-radius:12px;overflow:hidden;background:var(--studio-2);border:2px solid transparent;display:grid;place-items:center}
.fchip .fthumb img{width:100%;height:100%;object-fit:cover;display:block}
.fchip[aria-pressed="true"]{color:var(--studio-ink)}
.fchip[aria-pressed="true"] .fthumb{border-color:var(--handle)}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:8px 12px}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--studio-ink);min-height:56px;justify-content:center;border-radius:12px}
.tool:active{background:var(--studio-2)}
.tool.danger{color:#FF7A7A}

/* ---------- sheet / toast / busy ---------- */
.sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-scrim{position:absolute;inset:0;background:rgba(8,9,14,.45);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet-panel{position:relative;background:var(--surface);color:var(--ink);border-radius:20px 20px 0 0;padding-top:8px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out;max-height:90%;overflow-y:auto}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet-panel h2{margin:4px 0 14px;font-size:19px}
.field{margin-bottom:14px}
.lbl{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(20,22,40,.14)}
.est{font-size:12.5px;color:var(--muted);margin:2px 0 14px;min-height:1.2em}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;width:min(440px,calc(100% - 32px));
  display:flex;align-items:center;gap:10px;background:#1C1E27;color:#F2F3F7;border-radius:14px;padding:12px 8px 12px 16px;box-shadow:0 12px 34px rgba(0,0,0,.3);font-size:14px;animation:up2 .22s ease-out}
@keyframes up2{from{opacity:0;transform:translate(-50%,10px)}}
#toast span{flex:1;min-width:0}
#toast button{color:var(--handle);font-weight:700;padding:8px 10px;border-radius:8px}
#busy{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(8,9,14,.55)}
#busy .box{display:flex;flex-direction:column;align-items:center;gap:14px;background:#1C1E27;color:#F2F3F7;padding:22px 26px;border-radius:18px;font-weight:500;min-width:200px;text-align:center}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:var(--handle);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3.5 8.5h3.2l1.8-2.8h7l1.8 2.8h3.2v10.5h-17z"/><circle cx="12" cy="13.3" r="3.6"/></symbol>
  <symbol id="i-photos" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17.5l5-5 4 4 3-3 4.5 4.5"/></symbol>
  <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 12.5V20h14v-7.5"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M10 7V4.5h4V7M6.8 7l1 13h8.4l1-13"/></symbol>
  <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M19.2 3.8v4.4h-4.4"/></symbol>
  <symbol id="i-crop" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-whole" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M8 4v3M16 4v3M8 20v-3M16 20v-3"/></symbol>
  <symbol id="i-auto" viewBox="0 0 24 24"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9z"/><path d="M18.5 16v4M16.5 18h4"/></symbol>
  <symbol id="i-retake" viewBox="0 0 24 24"><path d="M3.5 8.5h3.2l1.8-2.8h7l1.8 2.8h3.2v10.5h-17z"/><path d="M14.6 12.2a2.8 2.8 0 1 0-.5 2.6"/><path d="M14.9 10.4v2h-2"/></symbol>
</svg>

<div id="app">
  <!-- LIBRARY -->
  <section id="v-library" class="view">
    <header class="lib-head gut">
      <div>
        <div class="wordmark"><span class="mark" aria-hidden="true"></span>Flatbed</div>
        <div class="lib-sub" id="lib-sub">Pocket document scanner</div>
      </div>
    </header>
    <div class="lib-body gut" id="lib-body"></div>
    <footer class="actions gut">
      <button class="btn" id="lib-import"><svg class="i"><use href="#i-photos"/></svg>Import</button>
      <button class="btn primary" id="lib-scan" style="flex:2"><svg class="i"><use href="#i-camera"/></svg>Scan document</button>
    </footer>
  </section>

  <!-- DOCUMENT -->
  <section id="v-doc" class="view" hidden>
    <header class="bar gut">
      <button class="icon-btn" id="doc-back" aria-label="All scans"><svg class="i"><use href="#i-back"/></svg></button>
      <input class="doc-name-input" id="doc-name" aria-label="Document name" autocomplete="off" enterkeyhint="done">
      <button class="icon-btn" id="doc-delete" aria-label="Delete document"><svg class="i"><use href="#i-trash"/></svg></button>
    </header>
    <div class="doc-sub mono" id="doc-sub"></div>
    <div class="doc-body gut">
      <div class="grid" id="grid"></div>
      <p class="hint" id="grid-hint">Tap a page to crop, rotate or change its look. Press and hold to reorder.</p>
    </div>
    <footer class="actions gut">
      <button class="btn" id="doc-scan" aria-label="Scan another page"><svg class="i"><use href="#i-camera"/></svg>Scan</button>
      <button class="btn" id="doc-import" aria-label="Import photos"><svg class="i"><use href="#i-photos"/></svg>Photos</button>
      <button class="btn primary" id="doc-export" style="flex:1.4"><svg class="i"><use href="#i-export"/></svg>Export</button>
    </footer>
  </section>

  <!-- ADJUST CORNERS -->
  <section id="v-adjust" class="view studio" hidden>
    <header class="bar gut">
      <button class="text-btn" id="adj-cancel">Cancel</button>
      <div class="title" id="adj-title">Adjust corners</div>
      <button class="text-btn" id="adj-toggle"><svg class="i"><use href="#i-whole"/></svg><span>Whole</span></button>
    </header>
    <div class="status"><span class="chip" id="adj-chip"><span class="dot"></span><span>Finding page edges…</span></span></div>
    <div class="stage" id="adj-stage">
      <div id="adj-frame"><canvas id="adj-canvas"></canvas><svg id="adj-svg"></svg></div>
      <canvas id="loupe" hidden></canvas>
    </div>
    <footer class="actions gut">
      <button class="btn sq" id="adj-retake" aria-label="Retake photo" title="Retake"><svg class="i"><use href="#i-retake"/></svg></button>
      <button class="btn" id="adj-next">Keep + next</button>
      <button class="btn primary" id="adj-keep">Keep</button>
    </footer>
  </section>

  <!-- PAGE -->
  <section id="v-page" class="view studio" hidden>
    <header class="bar gut">
      <button class="icon-btn" id="pv-back" aria-label="Back to document"><svg class="i"><use href="#i-back"/></svg></button>
      <div class="title" id="pv-title">Page 1</div>
      <span style="width:44px"></span>
    </header>
    <div class="stage pv-stage" id="pv-stage"><img id="pv-img" alt="Scanned page"><div class="pv-spin" id="pv-spin" hidden><div class="spin"></div></div></div>
    <div class="filters gut" id="filters" role="group" aria-label="Look"></div>
    <div class="tools gut">
      <button class="tool" id="pv-crop"><svg class="i"><use href="#i-crop"/></svg>Crop</button>
      <button class="tool" id="pv-rotate"><svg class="i"><use href="#i-rotate"/></svg>Rotate</button>
      <button class="tool" id="pv-retake"><svg class="i"><use href="#i-retake"/></svg>Retake</button>
      <button class="tool danger" id="pv-delete"><svg class="i"><use href="#i-trash"/></svg>Delete</button>
    </div>
  </section>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-scrim" id="sheet-scrim"></div>

    adj.c[adj.active] = [Math.min(1, Math.max(0, (px + off[0]) / w)), Math.min(1, Math.max(0, (py + off[1]) / h))];
    drawOverlay(); drawLoupe();
  });

})();
function drawLoupe(){
  const L = 128, Z = 2.6, dpr = Math.min(2, window.devicePixelRatio || 1);
  const lc = $("#loupe"); if (lc.width !== L * dpr) { lc.width = L * dpr; lc.height = L * dpr; }
  const { w, h, x: bx, y: by } = adj.box; const [cx, cy] = [adj.c[adj.active][0] * w, adj.c[adj.active][1] * h];

  x.fillStyle = "#000"; x.fillRect(0, 0, L, L);
  x.save(); x.beginPath(); x.arc(L / 2, L / 2, L / 2, 0, Math.PI * 2); x.clip();
  x.translate(L / 2, L / 2); x.scale(Z, Z); x.translate(-cx, -cy);

  x.strokeStyle = "#FFB21E"; x.lineWidth = 1.6 / Z; x.beginPath();
  adj.c.forEach(([u, v], i) => { const X = u * w, Y = v * h; i ? x.lineTo(X, Y) : x.moveTo(X, Y); }); x.closePath(); x.stroke();
  x.restore();
  x.strokeStyle = "rgba(255,255,255,.9)"; x.lineWidth = 1; x.beginPath();
  x.moveTo(L / 2 - 10, L / 2); x.lineTo(L / 2 + 10, L / 2); x.moveTo(L / 2, L / 2 - 10); x.lineTo(L / 2, L / 2 + 10); x.stroke();
  const st = $("#adj-stage").getBoundingClientRect(); const sx = bx + cx, sy = by + cy;
  let ly = sy - 150; if (ly < 8) ly = sy + 40; if (ly + L > st.height - 4) ly = Math.max(8, sy - 150);
  let lx = sx - L / 2; lx = Math.min(st.width - L - 8, Math.max(8, lx));
  lc.style.left = lx + "px"; lc.style.top = ly + "px";
}
$("#adj-cancel").onclick = () => {

$("#adj-retake").onclick = () => { if (!adj) return; startCamera({ mode: adj.mode, pageId: adj.pageId }); };
$("#adj-keep").onclick = () => keepAdjust(false);
$("#adj-next").onclick = () => keepAdjust(true);
async function keepAdjust(next){
  if (!adj || !quadOk()) return;

  const a = adj; adj = null;
  let done;
  keeping = new Promise(r => done = r);
  busy(a.mode === "new" ? "Straightening page…" : "Updating page…"); await frame();
  let pageIdx = -1;
  try {
    if (a.mode === "new") {
      if (!cur) cur = newDoc();
      const page = { id: uid(), c: a.c, rot: 0, f: LS.get("filter", "auto") };
      await S.putBlob(page.id + ":o", a.blob); free(await renderPage(page, a.orig));
      cur.pages.push(page); freshId = page.id; pageIdx = cur.pages.length - 1;
    } else {
      const page = cur.pages.find(p => p.id === a.pageId); pageIdx = cur.pages.indexOf(page);

  else openPage(pageIdx);
}

/* ---------- page view ---------- */
let pv = null; // { idx, orig, small }
async function openPage(idx){
  if (!cur || idx < 0 || idx >= cur.pages.length) { if (cur) openDoc(cur); return; }
  if (pv && pv.orig) free(pv.orig, pv.small);
  const page = cur.pages[idx]; pv = { idx, page, orig: null, small: null };
  show("v-page");
  $("#pv-title").innerHTML = `Page ${idx + 1} <small class="mono">of ${cur.pages.length}</small>`;
  setPreview(page);
  renderFilterChips(true);
  const me = pv;
  try {
    const blob = await S.getBlob(page.id + ":o"); if (pv !== me) return; if (!blob) throw new Error("original missing");
    me.orig = await blobToCanvas(blob);
    const warped = warpPage(me.orig, page.c); me.small = scaleCanvas(warped, 180); free(warped);
    if (pv === me) renderFilterChips(false);
  } catch (e) { console.warn(e); if (pv === me) $("#filters").textContent = ""; }
}
async function setPreview(page){
  const img = $("#pv-img"); const old = img.dataset.url;
  const b = await S.getBlob(page.id + ":p");
  img.onerror = async () => {
    img.onerror = null;
    if (await repairPage(page)) { if (pv && pv.page === page) setPreview(page); }
    else toast("This page's image was lost. Tap Retake to scan it again.");
  };
  if (b) { const url = URL.createObjectURL(b); img.dataset.url = url; img.src = url; } else img.onerror();
  if (old) setTimeout(() => URL.revokeObjectURL(old), 30000);
}
function renderFilterChips(placeholder){
  const box = $("#filters"); box.textContent = ""; const page = pv.page;
  for (const f of FILTERS) {
    const b = document.createElement("button"); b.className = "fchip"; b.setAttribute("aria-pressed", page.f === f.id);
    b.innerHTML = `<span class="fthumb"></span><span>${f.label}</span>`;
    if (!placeholder && pv.small) {
      const c = rotateCanvas(applyFilter(pv.small, f.id), page.rot);
      c.style.cssText = "width:100%;height:100%;object-fit:cover;display:block"; b.firstElementChild.appendChild(c);
    } else b.firstElementChild.innerHTML = `<div class="spin" style="width:18px;height:18px;border-width:2px"></div>`;
    b.onclick = () => changePage({ f: f.id });

  }
}
async function changePage(patch){
  if (!pv || pv.working) return; const me = pv; const page = me.page;
  if (patch.f && patch.f === page.f) return;
  Object.assign(page, patch); if (patch.f) LS.set("filter", patch.f);
  [...$("#filters").children].forEach((b, i) => b.setAttribute("aria-pressed", FILTERS[i].id === page.f));
  me.working = true; $("#pv-img").classList.add("dim"); $("#pv-spin").hidden = false; await frame();
  try {
    if (!me.orig) me.orig = await blobToCanvas(await S.getBlob(page.id + ":o"));
    free(await renderPage(page, me.orig)); await saveDoc();
    if (pv === me) { await setPreview(page); if (patch.rot !== undefined) renderFilterChips(false); }
  } catch (e) { console.warn(e); toast("Couldn't update this page. Try again."); }
  finally { me.working = false; $("#pv-img").classList.remove("dim"); $("#pv-spin").hidden = true; }
}
$("#pv-back").onclick = () => { if (pv) free(pv.orig, pv.small); pv = null; openDoc(cur); };
$("#pv-rotate").onclick = () => pv && changePage({ rot: ((pv.page.rot || 0) + 1) % 4 });
$("#pv-crop").onclick = async () => {
  if (!pv) return; const page = pv.page;
  busy("Opening original…"); await frame();
  const orig = pv.orig || await blobToCanvas(await S.getBlob(page.id + ":o"));
  if (pv) { free(pv.small); pv = null; }

};
$("#pv-retake").onclick = () => { if (!pv) return; startCamera({ mode: "replace", pageId: pv.page.id }); };
$("#pv-delete").onclick = () => {
  if (!pv) return; const page = pv.page; const idx = cur.pages.indexOf(page); const doc = cur;
  doc.pages.splice(idx, 1); saveDoc(doc); free(pv.orig, pv.small); pv = null;
  openDoc(doc);
  toast(`Page ${idx + 1} deleted`, {
    undo: () => { doc.pages.splice(idx, 0, page); saveDoc(doc); if (cur === doc) renderDoc(); },
    commit: () => { S.delBlobs([page.id + ":o", page.id + ":p", page.id + ":t"]); dropThumb(page.id); }
  });
};
(() => { // swipe between pages
  const st = $("#pv-stage"); let sx = null, sy = 0;
  st.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; });
  st.addEventListener("pointerup", e => {
    if (sx == null || !pv) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { const n = pv.idx + (dx < 0 ? 1 : -1); if (n >= 0 && n < cur.pages.length) openPage(n); }
  });
})();

/* ---------- export ---------- */
const exportOpts = Object.assign({ format: "pdf", paper: "fit", quality: "standard" }, LS.get("export", {}));
const QUALITY = { small: { max: 1400, q: 0.62, k: 0.35 }, standard: { max: 2000, q: 0.76, k: 0.75 }, high: { max: 2600, q: 0.9, k: 1.15 } };
function openExport(){
  if (!cur || !cur.pages.length) return;
  $("#sheet").hidden = false; syncSheet();
}
function syncSheet(){
  document.querySelectorAll("#sheet .seg").forEach(seg => {
    const key = seg.dataset.key; seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === exportOpts[key]));
  });
  $("#f-paper").hidden = exportOpts.format !== "pdf";
  const n = cur.pages.length; const bytes = cur.pages.reduce((s, p) => s + (p.bytes || 300000), 0) * QUALITY[exportOpts.quality].k;
  const what = exportOpts.format === "pdf" ? `1 PDF, ${n} ${n === 1 ? "page" : "pages"}` : (n === 1 ? "1 JPG" : `${n} JPGs in a ZIP`);
  $("#est").textContent = `${what} · about ${fmtBytes(bytes)}`;
  $("#do-export").textContent = exportOpts.format === "pdf" ? "Save PDF" : (n === 1 ? "Save JPG" : "Save ZIP");
}
document.querySelectorAll("#sheet .seg").forEach(seg => seg.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; exportOpts[seg.dataset.key] = b.dataset.v; LS.set("export", exportOpts); syncSheet();
}));
$("#sheet-scrim").onclick = () => { $("#sheet").hidden = true; };
function safeName(s){ return (s || "Scan").replace(/[\\/:*?"<>|]+/g, "-").replace(/\s+/g, " ").trim().slice(0, 80) || "Scan"; }
async function pageJpeg(page, Q){
  const once = async () => {
    const src = await S.getBlob(page.id + ":p"); if (!src) throw new Error("missing");
    const c = await blobToCanvas(src, Q.max); const b = await toBlob(c, "image/jpeg", Q.q);
    const r = { blob: b, w: c.width, h: c.height }; free(c); return r;
  };
  try { return await once(); }
  catch (e) { if (await repairPage(page)) return once(); throw e; }
}
// Gets every page as a JPEG, skipping pages whose image is lost. Returns { items, lost: [page numbers] }.
async function collectPages(doc, label){
  const Q = QUALITY[exportOpts.quality]; const items = [], lost = [];
  for (let i = 0; i < doc.pages.length; i++) {
    busy(`${label} · page ${i + 1} of ${doc.pages.length}`); await frame();
    try { items.push(await pageJpeg(doc.pages[i], Q)); } catch (e) { console.warn("page export failed", i, e); lost.push(i + 1); }
  }
  return { items, lost };
}
async function buildPdf(items, doc){
  const { jsPDF } = window.jspdf; let pdf = null;
  for (let i = 0; i < items.length; i++) {
    const { blob, w, h } = items[i];
    const bytes = new Uint8Array(await blob.arrayBuffer());
    let pw, ph;
    if (exportOpts.paper === "fit") { if (w >= h) { ph = 210; pw = 210 * w / h; } else { pw = 210; ph = 210 * h / w; } }
    else { const [a, b] = PAPER[exportOpts.paper]; if (w > h) { pw = b; ph = a; } else { pw = a; ph = b; } }
    const orient = pw > ph ? "l" : "p";
    if (!pdf) pdf = new jsPDF({ unit: "mm", format: [pw, ph], orientation: orient, compress: true }); else pdf.addPage([pw, ph], orient);
    const s = Math.min(pw / w, ph / h); const dw = w * s, dh = h * s;
    pdf.addImage(bytes, "JPEG", (pw - dw) / 2, (ph - dh) / 2, dw, dh, undefined, "NONE");
  }
  pdf.setProperties({ title: doc.name, creator: "Flatbed" });
  return pdf.output("blob");
}
async function saveFile(filename, blob, note = ""){
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
  if (dl) {
    try { await dl.save({ filename, data: blob }); toast(note || `Saved ${filename}`); }
    catch (e) {
      const code = (e && e.code) || "unknown";
      if (code === "declined") return;
      const msg = {
        rate_limited: "A save is already waiting for your answer. Finish that one, then try again.",
        too_large: "That file is too big to save here. Choose Small quality and try again.",
      }[code] || `Saving didn't work in this view (${code}). Try again from the Claude app.`;
      toast(msg);
    }
    return;
  }
  // Standalone site: building the file takes too long for iOS to still count the Export tap, so the share sheet
  // opens from a second tap on "Save or share…".
  const type = { pdf: "application/pdf", zip: "application/zip", jpg: "image/jpeg" }[filename.split(".").pop()] || blob.type;
  const file = new File([blob], filename, { type });
  $("#ready-title").textContent = filename.endsWith(".pdf") ? "Your PDF is ready" : "Your images are ready";
  $("#ready-info").textContent = `${filename} · ${fmtBytes(blob.size)}${note ? " · " + note : ""}`;
  $("#ready").hidden = false;
  $("#ready-share").onclick = async () => {
    $("#ready").hidden = true;
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: filename }); return; }
      catch (e) { if (e && e.name === "AbortError") return; console.warn("share failed", e); }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000); toast(`Saved ${filename}`);
  };
}
$("#ready-scrim").onclick = () => { $("#ready").hidden = true; };
$("#do-export").onclick = async () => {
  const doc = cur; if (!doc) return; $("#sheet").hidden = true; const base = safeName(doc.name);
  let file, name, lost = [], step = "reading pages";
  try {
    const pdfMode = exportOpts.format === "pdf";
    const got = await collectPages(doc, pdfMode ? "Building PDF" : "Preparing images"); lost = got.lost;
    if (!got.items.length) { unbusy(); renderDoc(); toast("None of these pages could be read. Retake them, then export again."); return; }
    if (pdfMode) { step = "building the PDF"; busy("Building PDF…"); await frame(); file = await buildPdf(got.items, doc); name = base + ".pdf"; }
    else if (got.items.length === 1) { file = got.items[0].blob; name = base + ".jpg"; }
    else {
      step = "zipping"; busy("Zipping…"); await frame(); const zip = new JSZip();
      got.items.forEach((it, i) => zip.file(`${base} ${String(i + 1).padStart(2, "0")}.jpg`, it.blob));
      file = await zip.generateAsync({ type: "blob", compression: "STORE" }); name = base + ".zip";
    }
  } catch (e) {
    console.warn(e); unbusy();
    toast(`Export stopped while ${step} (${(e && e.message) || "unknown error"}). Try again; if it keeps failing, export fewer pages.`); return;
  }
  unbusy(); if (lost.length) renderDoc();
  await saveFile(name, file, lost.length ? `Page ${lost.join(", ")} couldn't be read and ${lost.length === 1 ? "was" : "were"} left out.` : "");
};

/* ---------- sample photo ---------- */
async function trySample(){
  busy("Setting up the sample…"); await frame();
  const c = makeSample(); const blob = await toBlob(c, "image/jpeg", 0.9); unbusy();
  cur = null; openAdjust({ orig: c, blob, mode: "new" });
}
function makeSample(){
  const W = 1500, H = 2000; const c = mkCanvas(W, H); const x = c.getContext("2d");
  // a walnut desk
  const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, "#5a3b26"); g.addColorStop(1, "#3b2517"); x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 140; i++) { x.strokeStyle = `rgba(${i % 2 ? "20,10,4" : "120,80,50"},${0.05 + Math.random() * 0.08})`; x.lineWidth = 2 + Math.random() * 6; x.beginPath(); const y = Math.random() * H; x.moveTo(0, y); x.bezierCurveTo(W * .3, y + 30 * Math.sin(i), W * .7, y - 30 * Math.cos(i), W, y + 10); x.stroke(); }
  // the receipt, flat
  const PW = 850, PH = 1100; const p = mkCanvas(PW, PH); const px = p.getContext("2d");
  px.fillStyle = "#f6f3ea"; px.fillRect(0, 0, PW, PH);
  px.fillStyle = "#1e2230"; px.font = "700 46px Georgia, serif"; px.fillText("Harbor Street Hardware", 70, 120);
  px.font = "24px Georgia, serif"; px.fillStyle = "#4a4f60"; px.fillText("212 Harbor St · Portside · (555) 018-2240", 70, 162);
  px.fillStyle = "#1e2230"; px.font = "600 28px Menlo, monospace"; px.fillText("RECEIPT  No. 004817", 70, 240);
  px.font = "24px Menlo, monospace"; px.fillText("23 Nov 2026   14:05   Till 2", 70, 280);
  px.fillRect(70, 310, PW - 140, 3);
  const items = [["Wood screws 4x40 (200)", "8.90"], ["Wall plugs, mixed (100)", "5.40"], ["Sanding sheets P120 x10", "6.75"], ["Masking tape 25 mm", "3.20"], ["Hinge, brass 75 mm x2", "11.60"], ["Wood glue 250 ml", "7.95"], ["Drill bit set, HSS", "19.90"]];
  px.font = "26px Menlo, monospace"; items.forEach(([n, v], i) => { const y = 370 + i * 52; px.fillText(n, 70, y); px.textAlign = "right"; px.fillText(v, PW - 70, y); px.textAlign = "left"; });
  px.fillRect(70, 740, PW - 140, 3);
  px.font = "700 32px Menlo, monospace"; px.fillText("TOTAL", 70, 800); px.textAlign = "right"; px.fillText("63.70", PW - 70, 800); px.textAlign = "left";
  px.font = "24px Menlo, monospace"; px.fillText("Card ···· 6411   Approved", 70, 850);
  for (let i = 0; i < 70; i++) { if (Math.random() < .62) px.fillRect(150 + i * 8, 900, Math.random() < .5 ? 3 : 5, 90); }
  px.save(); px.translate(600, 860); px.rotate(-0.22); px.strokeStyle = "#2f55c8"; px.lineWidth = 6; px.strokeRect(-110, -50, 220, 96);
  px.fillStyle = "#2f55c8"; px.font = "800 56px Helvetica, Arial, sans-serif"; px.textAlign = "center"; px.fillText("PAID", 0, 20); px.restore();
  px.fillStyle = "#4a4f60"; px.font = "italic 24px Georgia, serif"; px.fillText("Thank you. Keep this receipt for returns within 30 days.", 70, 1050);
  // project it onto the desk at an angle
  const quad = [[330, 330], [1190, 410], [1260, 1720], [240, 1660]];
  x.save(); x.shadowColor = "rgba(0,0,0,.55)"; x.shadowBlur = 50; x.shadowOffsetY = 18; x.fillStyle = "#e9e4d6";
  x.beginPath(); quad.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.closePath(); x.fill(); x.restore();
  const h = homography(quad, [[0, 0], [PW, 0], [PW, PH], [0, PH]]);
  const pd = px.getImageData(0, 0, PW, PH).data; const minX = 230, minY = 320, bw = 1040, bh = 1410;
  const img = x.getImageData(minX, minY, bw, bh); const d = img.data;
  for (let y = 0; y < bh; y++) for (let xx = 0; xx < bw; xx++) {
    const X = xx + minX, Y = y + minY; const w = h[6] * X + h[7] * Y + 1;
    const u = (h[0] * X + h[1] * Y + h[2]) / w, v = (h[3] * X + h[4] * Y + h[5]) / w;
    if (u < 0 || v < 0 || u >= PW - 1 || v >= PH - 1) continue;
    const si = ((v | 0) * PW + (u | 0)) * 4, di = (y * bw + xx) * 4;
    d[di] = pd[si]; d[di + 1] = pd[si + 1]; d[di + 2] = pd[si + 2];
  }
  x.putImageData(img, minX, minY);
  // warm lamp light and the phone's shadow
  x.globalCompositeOperation = "multiply";
  const lg = x.createRadialGradient(1300, 300, 100, 900, 900, 1500); lg.addColorStop(0, "rgba(255,240,210,1)"); lg.addColorStop(1, "rgba(150,130,110,1)");
  x.fillStyle = lg; x.fillRect(0, 0, W, H);
  const sg = x.createRadialGradient(300, 2000, 50, 300, 2000, 900); sg.addColorStop(0, "rgba(110,110,120,1)"); sg.addColorStop(1, "rgba(255,255,255,1)");
  x.fillStyle = sg; x.fillRect(0, 0, W, H);
  x.globalCompositeOperation = "source-over";
  return c;
}

/* ---------- boot ---------- */
(async () => {
  docs = await S.docs();
